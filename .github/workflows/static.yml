# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # GitHub Pages serves CSS and JS with max-age=14400, so a returning
      # visitor can run new HTML against four-hour-old scripts — which shows
      # up as half-applied changes rather than a clean cache miss. Stamping
      # the asset URLs with the commit SHA makes every deploy a new URL, so
      # HTML and assets can never be out of step.
      - name: Cache-bust asset URLs
        run: |
          sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g" index.html
          echo "Stamped $(grep -c "?v=${GITHUB_SHA:0:8}" index.html) asset URLs with ${GITHUB_SHA:0:8}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
